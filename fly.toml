app = "tg-ai-assistant-grxt777"
primary_region = "fra"

[build]

[env]
  DB_PATH = "/data/agent.db"
  PORT = "8080"

[mounts]
  source = "agent_data"
  destination = "/data"

# API для веб-админки. Машина не должна засыпать: в ней же работает бот.
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
